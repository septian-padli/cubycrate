services:
  cubycrate:
    # Official GHCR image default (v0.0.1-alpha.2). Override with CUBYCRATE_IMAGE/CUBYCRATE_VERSION for local development or custom tags.
    image: ${CUBYCRATE_IMAGE:-ghcr.io/septian-padli/cubycrate}:${CUBYCRATE_VERSION:-v0.0.1-alpha.2}
    container_name: ${CUBYCRATE_CONTAINER_NAME:-cubycrate}
    restart: unless-stopped
    ports:
      - "${CUBYCRATE_PORT:-8383}:8383"
    volumes:
      - cubycrate_data:/app/data
    environment:
      - ENV=production
      - PORT=8383
      # Set COOKIE_SECURE=true when running behind an HTTPS reverse proxy
      # - COOKIE_SECURE=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8383/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  cubycrate_data:
    name: ${CUBYCRATE_VOLUME_NAME:-cubycrate_data}
